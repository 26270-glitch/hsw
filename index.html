<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>한국사 랩 | 시대별 학습</title>
<style>
:root{--ink:#17202b;--muted:#74808d;--paper:#fbfaf7;--line:#e7e4de;--blue:#2455d6;--mint:#dff4ed;--yellow:#ffe4a6;--lav:#e9e5ff;--sky:#dceaff;--red:#f36f5e}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Malgun Gothic","Noto Sans KR",sans-serif}.shell{width:min(1160px,calc(100% - 36px));margin:auto}button{font:inherit;cursor:pointer;border:0}.top{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:-.06em}.mark{width:34px;height:34px;border-radius:11px;background:var(--blue);color:white;display:grid;place-items:center}.top button{background:none;color:var(--muted);font-size:13px}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:35px;padding:72px 0 58px;align-items:center}.kicker{font-size:13px;font-weight:bold;color:var(--blue);letter-spacing:.12em}.kicker:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:8px}h1{font-size:clamp(43px,7vw,78px);line-height:1.02;letter-spacing:-.1em;margin:18px 0}.hero p{max-width:550px;color:var(--muted);line-height:1.8;font-size:17px}.art{min-height:280px;background:var(--blue);border-radius:30px;padding:28px;color:white;position:relative;overflow:hidden;box-shadow:0 18px 50px #17202b18}.art:before{content:"";position:absolute;width:330px;height:330px;border:1px solid #ffffff40;border-radius:50%;right:-80px;top:-130px}.art small{opacity:.7}.art h2{position:relative;font-size:31px;line-height:1.25;letter-spacing:-.08em;margin-top:25px}.bars{position:absolute;right:32px;bottom:28px;display:flex;gap:12px;align-items:end}.bars i{display:block;width:38px;border-radius:8px 8px 0 0;background:#a6ecd7}.bars i:nth-child(1){height:48px}.bars i:nth-child(2){height:80px;background:#ffe29c}.bars i:nth-child(3){height:112px;background:#ff826f}.bars i:nth-child(4){height:72px;background:#fff}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.head h2{font-size:25px;letter-spacing:-.07em;margin:0}.head p{color:var(--muted);font-size:13px;margin:0}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding-bottom:80px}.card{min-height:235px;text-align:left;border-radius:23px;padding:22px;position:relative;transition:.2s transform,.2s box-shadow;box-shadow:0 5px 20px #17202b0b}.card:hover{transform:translateY(-5px);box-shadow:0 18px 50px #17202b18}.card.mint{background:var(--mint)}.card.yellow{background:var(--yellow)}.card.lav{background:var(--lav)}.card.sky{background:var(--sky)}.card em{font-style:normal;font-size:12px;font-weight:bold;opacity:.55}.card h3{font-size:22px;line-height:1.3;letter-spacing:-.08em;margin:27px 0 10px}.card p{color:#52606d;font-size:13px;line-height:1.6;margin:0}.card strong{position:absolute;bottom:20px;left:22px;font-size:11px}.go{position:absolute;right:18px;bottom:16px;width:35px;height:35px;border-radius:50%;background:#ffffffa8;font-size:19px}.work{display:none;padding:30px 0 70px}.work.show{display:block}.back{background:none;color:var(--muted);font-size:13px;padding:0;margin-bottom:24px}.workhead{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:20px}.workhead h2{margin:0;font-size:36px;letter-spacing:-.08em}.workhead p{color:var(--muted);margin:8px 0 0}.meter{min-width:240px}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:7px}.track{height:8px;background:#e5e8ee;border-radius:9px;overflow:hidden}.fill{height:100%;width:0;background:var(--blue);transition:.3s}.quiz{background:white;border:1px solid var(--line);border-radius:24px;padding:29px;max-width:790px;box-shadow:0 18px 50px #17202b12}.quiztop{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:bold}.level{color:var(--red)}.prompt{font-size:22px;line-height:1.55;letter-spacing:-.06em;margin:21px 0}.source{background:#fff9ed;border-left:4px solid #f3c95c;padding:15px 17px;color:#525b65;line-height:1.75;white-space:pre-line}.source b{display:block;color:#a76b00;font-size:12px;margin-bottom:4px}.choices{display:grid;gap:9px;margin-top:22px}.choice{display:flex;gap:12px;text-align:left;background:white;border:1px solid var(--line);border-radius:13px;padding:13px 15px;line-height:1.5}.choice:hover:not(:disabled){border-color:var(--blue);background:#f6f8ff}.choice:disabled{cursor:default}.choice .n{color:var(--blue);font-weight:bold}.choice.ok{background:#edfbf5;border-color:#36a77c}.choice.no{background:#fff0ed;border-color:var(--red)}.feedback{display:none;margin-top:17px;background:#f0f4ff;border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.7}.feedback.show{display:block}.next{display:none;background:var(--blue);color:white;border-radius:11px;padding:11px 18px;margin-top:17px;font-weight:bold}.next.show{display:inline-block}.result{display:none;text-align:center;padding:30px 10px}.result.show{display:block}.result .score{font-size:62px;font-weight:900;letter-spacing:-.08em;color:var(--blue)}.result h3{font-size:25px;letter-spacing:-.06em}.result p{color:var(--muted)}.retry{background:var(--ink);color:white;border-radius:11px;padding:11px 18px;font-weight:bold}@media(max-width:850px){.hero{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.shell{width:calc(100% - 28px)}.hero{padding:45px 0 40px}.cards{grid-template-columns:1fr}.workhead{display:block}.meter{margin-top:18px}.quiz{padding:20px}.prompt{font-size:20px}}
/* layered controls give each interaction a physical resting and pressed state */
.top button,.back{transition:transform .18s ease,color .18s ease;text-shadow:0 1px 0 #fff}.top button:hover,.back:hover{color:var(--blue);transform:translateX(-3px)}
.card{border:1px solid #ffffffaa;box-shadow:0 5px 0 #17202b1c,0 14px 24px #17202b14;transform:translateY(0);transition:transform .18s ease,box-shadow .18s ease}
.card:hover{transform:translateY(-7px);box-shadow:0 9px 0 #17202b22,0 23px 30px #17202b1c}.card:active{transform:translateY(-2px);box-shadow:0 3px 0 #17202b1c,0 9px 16px #17202b12}
.go{box-shadow:0 3px 0 #17202b25,0 6px 12px #17202b12;transition:transform .18s ease,box-shadow .18s ease}.card:hover .go{transform:translate(2px,-2px);box-shadow:0 5px 0 #17202b25,0 9px 14px #17202b16}.card:active .go{transform:translate(2px,1px);box-shadow:0 1px 0 #17202b25}
.choice{position:relative;box-shadow:0 3px 0 #17202b14,0 7px 14px #17202b08;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease,background .15s ease}.choice:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 0 #2455d625,0 10px 18px #2455d612}.choice:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #2455d625,0 3px 8px #2455d60c}
.next,.retry{box-shadow:0 4px 0 var(--blue-dark),0 9px 16px #2455d633;transition:transform .15s ease,box-shadow .15s ease}.next:hover,.retry:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--blue-dark),0 13px 20px #2455d63d}.next:active,.retry:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue-dark),0 4px 8px #2455d622}.retry{box-shadow:0 4px 0 #070b10,0 9px 16px #17202b30}.retry:hover{box-shadow:0 6px 0 #070b10,0 13px 20px #17202b38}.retry:active{box-shadow:0 1px 0 #070b10,0 4px 8px #17202b22}
.quiz{position:relative;overflow:hidden;border:1px solid #d9e0f2;box-shadow:0 10px 0 #d9e0f2,0 24px 42px #17202b16}.quiz:before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:var(--blue)}.quiz:after{content:"✦  ✦  ✦";position:absolute;right:25px;top:17px;color:#cbd5f4;font-size:13px;letter-spacing:5px}.quiztop{margin-top:5px;background:#f1f4ff;border-radius:13px;padding:10px 14px;color:var(--blue);letter-spacing:.1em}.quiztop .level{background:#fff0ed;border-radius:99px;padding:4px 10px;letter-spacing:0}.prompt{border-left:7px solid var(--red);background:#fffafa;border-radius:0 15px 15px 0;padding:17px 19px;box-shadow:inset 0 -2px 0 #f8e3df}.source{position:relative;border:1px solid #f4dfae;border-left:5px solid #f2c554;border-radius:14px;background:#fffaf0;box-shadow:0 4px 0 #f7ecd2}.source:before{content:"자료 탐정";display:inline-block;margin-bottom:8px;padding:4px 9px;background:#f2c554;color:#674900;border-radius:7px;font:800 11px "Malgun Gothic",sans-serif;letter-spacing:.02em}.source b{display:none}.choice{align-items:center;min-height:57px;background:#fff;box-shadow:0 3px 0 #dfe3eb,0 7px 14px #17202b08}.choice .n{display:grid;place-items:center;flex:0 0 29px;width:29px;height:29px;border-radius:10px;background:#e9edff;color:var(--blue);box-shadow:inset 0 -2px 0 #cbd5f4}.choice:nth-child(2) .n{background:#fff1c9;color:#9a6b00;box-shadow:inset 0 -2px 0 #f0d687}.choice:nth-child(3) .n{background:#e2f6ee;color:#28775d;box-shadow:inset 0 -2px 0 #b9e4d3}.choice:nth-child(4) .n{background:#ffe8e3;color:#b94a3d;box-shadow:inset 0 -2px 0 #f4c4ba}.choice:nth-child(5) .n{background:#eee9ff;color:#654cc1;box-shadow:inset 0 -2px 0 #d1c6f4}.feedback{border:1px solid #cbd5f4;box-shadow:0 3px 0 #dce3fa;animation:pop .25s ease}.result{background:#f5f7ff;border-radius:18px;margin-top:15px}@keyframes pop{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="shell"><nav class="top"><div class="brand"><span class="mark">史</span>한국사 랩</div><button id="homeBtn">처음으로</button></nav>
<main id="home"><section class="hero"><div><div class="kicker">MIDTERM STUDY ROOM</div><h1>역사를<br>장면으로 풀다.</h1><p>한국사 II 중간고사 범위를 네 개의 시대 흐름과 종합 복습으로 나눴습니다. 자료를 읽고 선택하며 시대의 맥락을 연결해 보세요.</p></div><div class="art"><small>1910 — 1950 · KOREAN HISTORY II</small><h2>기억은 연결될 때<br>지식이 됩니다.</h2><div class="bars"><i></i><i></i><i></i><i></i></div></div></section><section><div class="head"><div><h2>시대별 학습실</h2><p>각 영역 10문제 · 총 50문제</p></div><p>카드를 선택해 시작하세요 →</p></div><div class="cards" id="cards"></div></section></main>
<section class="work" id="work"><button class="back" id="back">← 시대 목록으로</button><div class="workhead"><div><h2 id="title"></h2><p id="desc"></p></div><div class="meter"><div class="meta"><span id="count"></span><span id="points"></span></div><div class="track"><div class="fill" id="fill"></div></div></div></div><div class="quiz"><div id="quiz"></div><div class="result" id="result"><div class="score" id="resultScore"></div><h3>학습을 마쳤습니다.</h3><p id="resultText"></p><button class="retry" id="retry">다시 풀기</button></div></div></section></div>
<script>
const eras=[
{id:'a',tone:'mint',num:'01',title:'1910년대',name:'무단 통치와 수탈',desc:'헌병 경찰, 토지 조사 사업, 식민 지배의 구조',qs:[
['헌병 경찰을 앞세워 조선 총독이 강한 권한을 행사하였다.','자료에 해당하는 통치 방식은?',['무단 통치','문화 통치','민족 말살 통치','자치 통치','군정 통치'],0,'1910년대 일제는 헌병 경찰과 총독의 강력한 권한을 바탕으로 무단 통치를 실시했다.'],
['회사 설립은 총독의 허가를 받아야 한다. (회사령)','회사령의 목적으로 옳은 것은?',['민족 자본의 억제','농민의 토지 보장','노동조합 육성','기업 활동 자유화','일본 기업 제한'],0,'회사령은 조선인의 회사 설립을 허가제로 묶어 민족 자본을 억제했다.'],
['토지 소유자는 정해진 기간에 신고해야 하며, 신고하지 않은 토지는 총독부가 처리한다.','자료와 관련된 사업의 결과는?',['총독부의 토지 지배 강화','농민의 자작농화','소작료 폐지','토지 균등 분배','지주제 해체'],0,'토지 조사 사업은 신고하지 않은 토지를 국유지로 편입해 총독부의 토지 지배를 강화했다.'],
['조선 태형령은 일정한 범죄를 저지른 한국인에게 태형을 집행할 수 있게 하였다.','자료가 보여 주는 특징은?',['민족 차별적 법 적용','언론 자유 확대','지방 자치 확대','교육 평등','사법권 독립'],0,'조선 태형령은 한국인에게만 적용된 대표적인 차별 법령이다.'],
['관리와 교원은 제복을 입고 칼을 차야 했다.','이 자료의 통치 특징은?',['무단 통치의 강압성','민립 대학 운동','신간회 활동','산미 증식','황국 신민화'],0,'관리와 교원의 제복·착검은 무단 통치의 대표적인 모습이다.'],
['동양 척식 주식회사는 조선의 토지를 매입하고 일본인 이주를 지원하였다.','이 기관의 성격은?',['식민지 수탈 기관','독립운동 단체','민족 교육 기관','농민 자치 기관','외교 기관'],0,'동양 척식 주식회사는 토지와 농업을 장악한 식민지 수탈 기관이다.'],
['1910년 한국은 일본에 강제로 병합되었다.','한일 병합 이후 설치된 기관은?',['조선 총독부','대한민국 임시 정부','미·소 공동 위원회','통리기무아문','독립 협회'],0,'한일 병합 이후 일제는 조선 총독부를 설치했다.'],
['토지 조사 사업 이후 소유권을 인정받지 못한 농민은 소작농이 되었다.','그 결과로 나타난 변화는?',['소작농 증가','자작농 증가','농민 참정권 확대','지주제 해체','도시화 완성'],0,'토지 조사 사업은 많은 농민을 소작농으로 전락시켰다.'],
['1910년대 조선 총독부는 집회·결사와 언론 활동을 엄격히 통제하였다.','이 통치의 목적은?',['저항 억압','정치 참여 확대','민족 문화 육성','독립 지원','노동권 보호'],0,'무단 통치는 강압적 경찰력으로 식민 지배에 대한 저항을 억누르는 데 목적이 있었다.'],
['토지와 자원을 조사·관리하고 일본 자본의 진출을 보장하였다.','자료의 공통된 결과는?',['식민지 경제 구조 형성','민족 경제 자립','농민 생활 안정','기업 활동 확대','산업 독립'],0,'토지와 기업을 통제한 정책은 조선을 일본 경제에 종속시켰다.']]},
{id:'b',tone:'yellow',num:'02',title:'1920년대',name:'문화 통치와 민족 운동',desc:'3·1 운동 이후의 변화와 사회·경제·교육 운동',qs:[
['3·1 운동 이후 헌병 경찰이 보통 경찰로 바뀌고 조선어 신문이 일부 허용되었다.','이 시기의 통치 방식은?',['문화 통치','무단 통치','민족 말살','군정','통감 정치'],0,'3·1 운동 이후 일제는 겉으로 통치 방식을 완화한 문화 통치를 실시했다.'],
['“대한 독립”을 외치며 학생·시민·농민이 전국에서 만세 시위를 벌였다.','자료에 해당하는 운동은?',['3·1 운동','6·10 만세 운동','광주 학생 항일 운동','물산 장려 운동','형평 운동'],0,'1919년 전국으로 확산된 만세 시위는 3·1 운동이다.'],
['3·1 운동의 영향으로 중국 상하이에 임시 정부가 수립되었다.','임시 정부의 기본 이념은?',['민주 공화제','입헌 군주제','전제 군주제','식민 자치제','사회주의 일당제'],0,'대한민국 임시 정부는 민주 공화제를 표방했다.'],
['“내 살림 내 것으로, 우리 물건 우리가 쓰자.”','자료와 관련된 운동은?',['물산 장려 운동','민립 대학 운동','브나로드 운동','국채 보상 운동','형평 운동'],0,'물산 장려 운동은 국산품 애용으로 민족 자본을 육성하려 했다.'],

document.getElementById('cards').innerHTML=eras.map(e=>`<button class="card ${e.tone}" data-id="${e.id}"><em>${e.num} / 05</em><h3>${e.title}<br>${e.name}</h3><p>${e.desc}</p><strong>10 QUESTIONS</strong><span class="go">↗</span></button>`).join('');
function start(id,updateUrl=true){era=eras.find(e=>e.id===id);if(!era)return;if(updateUrl)history.pushState({id},'',`#quiz-${id}`);index=0;score=0;home.style.display='none';work.classList.add('show');document.title=`${era.title} · ${era.name} | 한국사 랩`;document.getElementById('title').textContent=era.title+' · '+era.name;document.getElementById('desc').textContent=era.desc;draw();scrollTo({top:0,behavior:'smooth'});}
function draw(){const q=era.qs[index];answered=false;document.getElementById('count').textContent=`${index+1} / 10`;document.getElementById('points').textContent=`점수 ${score}`;document.getElementById('fill').style.width=`${index*10}%`;document.getElementById('quiz').innerHTML=`<div class="quiztop"><span>QUESTION ${String(index+1).padStart(2,'0')}</span><span class="level">${index<3?'기본':index<7?'발전':'심화'}</span></div><h3 class="prompt">${q[1]}</h3><div class="source"><b>사료·자료</b>${q[0]}</div><div class="choices">${q[2].map((x,i)=>`<button class="choice" data-i="${i}"><span class="n">${i+1}</span><span>${x}</span></button>`).join('')}</div><div class="feedback" id="feedback"></div><button class="next" id="next">${index===9?'결과 보기':'다음 문제'} →</button>`;document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(+b.dataset.i,q));document.getElementById('next').onclick=next;}
function answer(selected,q){if(answered)return;answered=true;document.querySelectorAll('.choice').forEach((b,i)=>{b.disabled=true;if(i===q[3])b.classList.add('ok');if(i===selected&&i!==q[3])b.classList.add('no')});if(selected===q[3])score++;document.getElementById('points').textContent=`점수 ${score}`;const f=document.getElementById('feedback');f.innerHTML=`<b>${selected===q[3]?'정답입니다.':'다시 살펴보세요.'}</b> ${q[4]}`;f.classList.add('show');document.getElementById('next').classList.add('show');}
function next(){if(index===9){document.getElementById('quiz').innerHTML='';document.getElementById('result').classList.add('show');document.getElementById('resultScore').textContent=`${score} / 10`;document.getElementById('resultText').textContent=score>=8?'시대의 흐름을 아주 잘 잡고 있습니다.':score>=5?'핵심 개념을 다시 연결해 보세요.':'자료와 사건의 순서를 중심으로 복습해 보세요.';document.getElementById('fill').style.width='100%';return}index++;draw();}
function homeGo(updateUrl=true){if(updateUrl)history.pushState({},'', '#home');work.classList.remove('show');document.getElementById('result').classList.remove('show');home.style.display='block';document.title='한국사 랩 | 시대별 학습';scrollTo({top:0,behavior:'smooth'});}function route(){const id=location.hash.startsWith('#quiz-')?location.hash.slice(6):'';if(id)start(id,false);else homeGo(false);}document.querySelectorAll('.card').forEach(b=>b.onclick=()=>start(b.dataset.id));document.getElementById('back').onclick=()=>homeGo();document.getElementById('homeBtn').onclick=()=>homeGo();document.getElementById('retry').onclick=()=>start(era.id);window.addEventListener('popstate',route);if(location.hash)route();
</script></body></html>
